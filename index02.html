<script>
// -地図ごとの設定 画像最大サイズ  座標  	x左端      	x右端   	z上端      	z下端  
const mapConfigs = {
    main:        { width:  9067, height:  6400, minX: -896-64,	maxX: 1152+64,	minZ: -448,	maxZ: 1088  },
    all:         { width: 18892, height: 15247, minX: -40960,	maxX: 10112,	minZ: -30720,	maxZ: 10112 },
    nether:      { width: 11086, height:  8905, minX: -4224,	maxX: 1280,	minZ: -3328,	maxZ: 1280 },

    new:         { width:  7166, height:  7166, minX: -640-64,	maxX: 896+64,	minZ: -640-64,	maxZ: 896+64 },
    new_all:     { width:  9452, height:  9450, minX: -10240,	maxX: 10112,	minZ: -10240,	maxZ: 10112},
    new_nether:  { width:  9734, height:  9653, minX: -3968-128,maxX: 896+128,	minZ: -2432-128,maxZ: 2432+128 },

    new_2026:    { width: 14336, height: 13312, minX: -2048-64,	maxX: 1408+64,	minZ: -2304-64,	maxZ: 896+64 }//,
    //omatsuri2023:{ width:  9452, height:  9450, minX: -10240,	maxX: 10112,	minZ: -10240,	maxZ: 10112 }
};

// --- CSV座標 → 画像座標変換 ---
function csvToImageCoordinates(mapId, csvX, csvZ){
    const cfg = mapConfigs[mapId];
    if(!cfg) return { x: csvX, y: csvZ };
    const px = Math.floor((csvX - cfg.minX) / (cfg.maxX - cfg.minX) * cfg.width);
    const py = Math.floor((csvZ - cfg.minZ) / (cfg.maxZ - cfg.minZ) * cfg.height);
    return { x: px, y: py };
}


//addHandler関数  ズーム制御
function attachZoomHandler(viewer, zoomFactor){//各地図の倍率のための設定
    
    viewer.zoomFactor = zoomFactor;
    function updateScale(){
        const zoom = viewer.viewport.getZoom(true);	// 現在の倍率
        const scale = zoom * viewer.zoomFactor;		// 最小倍率を基準にスケーリング

        viewer.element.querySelectorAll('.map-marker').forEach(el => {
            const initial = el.dataset.initialTransform || "";
	    const match = initial.match(/scale\((.+)\)/);
	    const initialScale = match ? parseFloat(match[1]) : 1; // match がなければ 1 を使う
            el.style.transform = `${initial} scale(${scale / initialScale})`;
        });
    }

    // viewerに関数を持たせておく
    viewer.updateMarkerScale = updateScale;

    // 初期化＆ズーム時に呼び出す
    viewer.addHandler('viewport-change', updateScale);
    viewer.addHandler('open', updateScale);
    viewer.addHandler('animation', updateScale); // ズームアニメーション対応

    // 初期表示時も適用
    updateScale();
}//addHandler end

// マーカー設置追加関数
function addMarker(viewer, imageX, imageY, label, zahyouFlag, icon, spriteX, spriteY, iconSize, csvX, csvZ){

  const viewportPoint =  viewer.viewport.imageToViewportCoordinates(imageX, imageY);

  const el = document.createElement("div");
  el.className = "map-marker";

  // 元画像スプライト情報
  const imageSize = 176;     // 元画像全体サイズ
  const gridCount = 4;       // 4×4分割
  const cellSize = imageSize / gridCount;// 1セルのサイズ(44px)

  const scaleRatio = iconSize / cellSize;

// 文字サイズ設定
  const markerStyle = {
    scale: 1.2,             // 表示倍率
    fontSize: "10px",       // 文字サイズ
    fontWeight: "bold",     // 太字
    iconSize: iconSize || 24 // アイコンサイズ（デフォルト24px）
  };

  // アイコン画像がある場合のみ表示
  let iconHTML = "";
  if(icon && iconSize > 0){

    const bgSize = imageSize * scaleRatio;
    const posX = (cellSize * (spriteX - 1)) * scaleRatio;
    const posY = (cellSize * (spriteY - 1)) * scaleRatio;

    iconHTML = `
    <div
         style="
           width:${iconSize}px;
           height:${iconSize}px;
           background-image:url(${icon});
	background-position:-${posX}px -${posY}px;
	background-size:${bgSize}px ${bgSize}px;
	   background-repeat:no-repeat;
	   margin:0;
         ">
    </div>`;
  }

  // 文字がある場合のみ表示
  let labelHTML = "";
  if(label && label.trim() !== ""){
	if(zahyouFlag && (zahyouFlag.trim() === "はい" ||zahyouFlag.toLowerCase() === "yes"||zahyouFlag.toLowerCase() === "on")){

    labelHTML = `
      <div style="line-height:1.2; font-size:${markerStyle.fontSize};">
        ${label}<br>
        <span style="font-size:8px; opacity:0.7;">
          (${csvX}/${csvZ})
        </span>
      </div>
    `;

  } else {
    labelHTML = `<div style="margin:0; line-height:1; font-size:${markerStyle.fontSize};font-weight:${markerStyle.fontWeight};">${label}</div>`;
  }
}
  // HTMLにまとめる
  el.innerHTML = iconHTML + labelHTML;


  // OpenSeadragon でズームに追従させる
  viewer.addOverlay({
    element: el,
     location: viewer.viewport.imageToViewportCoordinates(imageX, imageY),
    placement: "CENTER"  // 中心に合わせる
  });


// ★ scale は open 後に計算する
  viewer.addHandler('open', function(){

   // ★ ここで直接スケール適用
   if (viewer.updateMarkerScale) {
     setTimeout(() => {
       viewer.updateMarkerScale();
     }, 0);
   }

 // ★ 初期 scale をタブごとに設定
    const zoom = viewer.viewport.getZoom(true);
    const scale = zoom * (viewer.zoomFactor || 0.4); // viewer.zoomFactor があれば使う 安全のためのデフォルト値0.4(目安)
    el.style.transform = `scale(${scale})`;


// 初期 transform を保持しておく
  const initialTransform = el.style.transform;
  el.dataset.initialTransform = initialTransform;
 });


//el.style.transform = "scale(1)";
//el.dataset.initialTransform = "scale(1)";


}//addMarker end


// ▼ CSV読み込み
function loadMarkers(viewer, csvFile){

  fetch(csvFile)
    .then(res => res.text())
    .then(text => {

      const rows = text.split("\n").slice(1);

      rows.forEach(row => {
	// 文字列中のカンマや改行を正しく扱う(現在無効)
  	//if(!cols || cols.length < 8) return;// 列が足りなければスキップ

        const [x,z,label,zahyouFlag,icon,spriteX,spriteY,iconSize] = row.split(",");

	// 数値化と空文字チェック
        const xi = parseFloat(x);
        const zi = parseFloat(z);		// Zを画像Y座標として扱う
        const sX = parseInt(spriteX) || 1;
        const sY = parseInt(spriteY) || 1;

	if(isNaN(xi) || isNaN(zi)) return;

        // CSV優先、なければタブ基本サイズ
        const csvSize = parseFloat(iconSize);
        const finalSize = !isNaN(csvSize)
          ? csvSize
          : viewer.baseIconSize;

        // CSV座標 → 画像座標に変換
        const coords = csvToImageCoordinates(viewer.mapId, xi, zi);

        addMarker(viewer, coords.x, coords.y, label,zahyouFlag, icon, sX, sY, finalSize, xi, zi);
      });

      // ★ マーカー追加後に1フレーム待ってから正しいscale適用
      requestAnimationFrame(() => {
        if (viewer.updateMarkerScale) {
          viewer.updateMarkerScale();
        }
      });

    });
}//loadMarkers end


window.addEventListener("resize", () => {
  [
    viewer_2434map_main,
    viewer_2434map_all,

    if (!v) return;
    v.viewport && v.viewport.update();
  });
});


const isMobile = window.innerWidth < 768;

/* =========================
   Googleマップ風切替
========================= */
function switchMap(mapId){

  const viewers = {
    main: viewer_2434map_main,
    all: viewer_2434map_all,
    nether: viewer_2434map_nether,
    new: viewer_2434map_new,
    new_all: viewer_2434map_new_all,
    new_nether: viewer_2434map_new_nether,
    new_2026: viewer_2434map_new_2026
  };

  // 全タブパネル取得
  const panels = {
    main: document.getElementById("normal_tab01"),
    all: document.getElementById("all_tab01"),
    nether: document.getElementById("nether_tab01"),
    land: document.getElementById("land_tab01"),
    new: document.getElementById("newworld_tab01"),
    new_all: document.getElementById("newworld_all_tab01"),
    new_nether: document.getElementById("newworld_nether_tab01"),
    sakura: document.getElementById("sakura_tab01"),
    new_2026: document.getElementById("newworld_2026_tab01")
  };

  Object.entries(panels).forEach(([key, panel]) => {
    if (!panel) return;
    panel.style.display = (key === mapId) ? "block" : "none";
  });

  // OpenSeadragonだけ後処理
  Object.entries(viewers).forEach(([key, v]) => {
    if (!v) return;
    const isActive = (key === mapId);
    v.element.style.display = isActive ? "block" : "none";

    if(isActive){
      requestAnimationFrame(() => {
       v.forceRedraw?.();
       v.viewport.update();
       v.viewport.goHome(true);

       requestAnimationFrame(() => {
        // サイズ再計算
        v.viewport.update();
        v.updateMarkerScale?.();
       });
      });
    }
  });
}

// ハンバーガーボタン開閉だけ
function toggleMapMenu(){
  const menu = document.querySelector(".map-menu");
  menu.classList.toggle("open");
}
// ボタン押したら自動で閉じる
window.addEventListener("DOMContentLoaded", () => {
 document.querySelectorAll(".map-menu button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelector(".map-menu").classList.remove("open");
  });
 });
});
/* =========================
   初期表示
========================= */
window.addEventListener("load", () => {
    switchMap("main");
});
